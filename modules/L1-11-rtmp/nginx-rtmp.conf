# nginx-rtmp.conf —— 生产参考配置（Nginx + nginx-rtmp-module）
#
# 本工程的自动化测试用 ffmpeg 的 rtmp listen 模式充当本地 RTMP 服务（零外部依赖），
# 该文件给出「真实部署」时的等价 Nginx 配置，供读者按需替换。
#
# 前置：编译安装带 rtmp 模块的 Nginx
#   ./configure --add-module=/path/to/nginx-rtmp-module
#   make && sudo make install
# 启动：
#   nginx -c /abs/path/nginx-rtmp.conf -p /abs/path
# 推流：
#   ffmpeg -re -i src.mp4 -c copy -f flv rtmp://127.0.0.1:1935/live/test
# 拉流：
#   ffplay rtmp://127.0.0.1:1935/live/test
#   # 或 HTTP-FLV： ffplay http://127.0.0.1:8080/live/test.flv
# 状态页：http://127.0.0.1:8080/stat

worker_processes  1;

events {
    worker_connections  1024;
}

# RTMP 服务块（由 nginx-rtmp-module 提供）
rtmp {
    server {
        listen 1935;            # RTMP 默认端口
        chunk_size 4096;        # RTMP chunk 大小

        # 直播应用：rtmp://host:1935/live/<streamName>
        application live {
            live on;            # 开启直播
            record off;         # 关闭录制
            # push rtmp://backup.example.com/live/backup;  # 多节点推流（中继/备份）
        }

        # HTTP-FLV 应用：把同一路流以 http-flv 形式暴露，便于浏览器/web 播放
        application hls {
            live on;
            hls on;
            hls_path /tmp/hls;          # HLS 切片落地目录
            hls_fragment 2s;            # 单切片时长
            hls_playlist_length 10s;    # m3u8 播放列表长度
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 8080;

        # RTMP 运行状态页
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        location /stat.xsl {
            root /path/to/nginx-rtmp-module;
        }

        # HTTP-FLV 拉流：http://host:8080/live/<streamName>.flv
        location /live {
            flv_live on;            # 由 nginx-rtmp-module 的 http-flv 支持
            chunked_transfer_encoding on;
            add_header 'Access-Control-Allow-Origin' '*';
        }

        # HLS 拉流：http://host:8080/hls/<streamName>.m3u8
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            add_header 'Cache-Control' 'no-cache';
            add_header 'Access-Control-Allow-Origin' '*';
        }
    }
}
